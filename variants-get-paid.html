<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get paid — варианты иконки</title>
<style>
  body{margin:0;background:#F3EFF6;font:14px/20px Inter,-apple-system,system-ui,sans-serif;color:#0A0A0A}
  .wrap{max-width:1200px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:40px}
  h1{font:700 24px/32px "Bricolage Grotesque",system-ui,sans-serif;margin:0}
  .v b{display:block;font:600 16px/24px Inter,system-ui,sans-serif;margin-bottom:12px}
  .frame{width:100%;aspect-ratio:1440/900;overflow:hidden;border-radius:24px;background:#fff;box-shadow:0 16px 40px -16px rgba(40,10,48,.24);position:relative}
  .frame iframe{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;transform-origin:0 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Иконка у «get paid» — 6 вариантов (самолётик у «send» остаётся)</h1>
</div>
<script>
const variants = [
  ['1 — купюра', 'fa-money-bill-wave'],
  ['2 — стопка монет', 'fa-coins'],
  ['3 — рука с долларом', 'fa-hand-holding-dollar'],
  ['4 — чек с долларом', 'fa-money-check-dollar'],
  ['5 — мешок с долларом', 'fa-sack-dollar'],
  ['6 — счёт с долларом', 'fa-file-invoice-dollar'],
];
const wrap = document.querySelector('.wrap');
const frames = [];
variants.forEach(([label, icon]) => {
  const v = document.createElement('section'); v.className = 'v';
  v.innerHTML = `<b>${label}</b><div class="frame"><iframe src="index.html?preview=${icon}" scrolling="no" loading="lazy"></iframe></div>`;
  wrap.append(v);
  const f = v.querySelector('iframe'); frames.push(f);
  f.addEventListener('load', () => {
    const d = f.contentDocument;
    // Font Awesome for the preview only
    const l = d.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';
    d.head.append(l);
    const chips = d.querySelectorAll('.hero h1 .chip');
    const chip = chips[2]; // pay, send, get paid
    if (chip) chip.innerHTML = `<i class="fa-solid ${icon}" style="font-size:36px;line-height:1"></i>`;
    // freeze on the first slide so all six look the same
    d.documentElement.style.overflow = 'hidden';
  });
});
const fit = () => frames.forEach(f => { const w = f.parentElement.clientWidth; f.style.transform = `scale(${w / 1440})`; });
addEventListener('resize', fit); fit();
</script>
</body>
</html>
