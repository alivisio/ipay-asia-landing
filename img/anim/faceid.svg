<style>
  svg{--fie1:cubic-bezier(.34,1.56,.64,1);--fie2:cubic-bezier(.22,1,.36,1)}
  .fip{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
  @keyframes fipop{0%{opacity:0;transform:scale(.25)}100%{opacity:1;transform:scale(1)}}
  @keyframes firise{0%{opacity:0;transform:translateY(10px) scale(.7)}100%{opacity:1;transform:none}}
  @keyframes fidrop{0%{opacity:0;transform:translateY(-12px) scale(.9)}100%{opacity:1;transform:none}}
  @keyframes fispin{0%{opacity:0;transform:scale(0) rotate(-120deg)}100%{opacity:1;transform:none}}
  @keyframes ficut{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes ficutrot{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
