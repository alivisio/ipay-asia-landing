<style>
  svg{--mbe1:cubic-bezier(.34,1.56,.64,1);--mbe2:cubic-bezier(.22,1,.36,1)}
  .mbp{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
  @keyframes mbpop{0%{opacity:0;transform:scale(.25)}100%{opacity:1;transform:scale(1)}}
  @keyframes mbrise{0%{opacity:0;transform:translateY(10px) scale(.7)}100%{opacity:1;transform:none}}
  @keyframes mbdrop{0%{opacity:0;transform:translateY(-12px) scale(.9)}100%{opacity:1;transform:none}}
  @keyframes mbspin{0%{opacity:0;transform:scale(0) rotate(-120deg)}100%{opacity:1;transform:none}}
  @keyframes mbcut{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes mbcutrot{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
  @keyframes mbwipex{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes mbwipey{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
  @keyframes mbflash{0%{opacity:0}22%{opacity:.3}100%{opacity:0}}

  .mbbill{animation:mbin .6s var(--mbe1) .05s both}
  .mbcoin{animation:mbcutrot .5s var(--mbe1) .5s both}
  .mbc1{animation:mbcut .3s var(--mbe1) .64s both}
  .mbc2{animation:mbcut .3s var(--mbe1) .7s both}
  @keyframes mbin{0%{opacity:0;transform:scale(.55) rotate(-12deg)}100%{opacity:1;transform:none}}

  @media (prefers-reduced-motion: reduce){[class*="mb"]{animation:none!important}}
</style>
