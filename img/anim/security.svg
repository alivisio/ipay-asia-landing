<style>
  svg{--she1:cubic-bezier(.34,1.56,.64,1);--she2:cubic-bezier(.22,1,.36,1)}
  .shp{transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
  @keyframes shpop{0%{opacity:0;transform:scale(.25)}100%{opacity:1;transform:scale(1)}}
  @keyframes shrise{0%{opacity:0;transform:translateY(10px) scale(.7)}100%{opacity:1;transform:none}}
  @keyframes shdrop{0%{opacity:0;transform:translateY(-12px) scale(.9)}100%{opacity:1;transform:none}}
  @keyframes shspin{0%{opacity:0;transform:scale(0) rotate(-120deg)}100%{opacity:1;transform:none}}
  @keyframes shcut{0%{transform:scale(0)}100%{transform:scale(1)}}
  @keyframes shcutrot{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
  @keyframes shwipex{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
  @keyframes shwipey{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
  @keyframes shflash{0%{opacity:0}22%{opacity:.3}100%{opacity:0}}

  .shshield{animation:shin .6s var(--she1) .05s both}
  .shcheck{animation:shwipex .45s var(--she2) .5s both;transform-origin:left center}
  .shflash{animation:shflash .6s ease-out .55s both}
  @keyframes shin{0%{opacity:0;transform:translateY(-10px) scale(.55)}100%{opacity:1;transform:none}}

  @media (prefers-reduced-motion: reduce){[class*="sh"]{animation:none!important}}
</style>
